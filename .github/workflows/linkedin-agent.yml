# Run LinkedIn Post Agent (email only — no local drafts/history)
#
# TEMP TEST (public repo): every 5 minutes. After user confirms scheduled
# emails, REVERT to 3× daily IST:
#   - cron: "30 3 * * *"   # ~9:00 IST
#   - cron: "30 8 * * *"   # ~14:00 IST
#   - cron: "30 13 * * *"  # ~19:00 IST
#
# Required secrets: SMTP_USER, SMTP_PASSWORD, EMAIL_TO
# Optional: OPENAI_API_KEY, AI_PROVIDER, ANTHROPIC_API_KEY

name: LinkedIn Post Agent

on:
  schedule:
    # TEMP: every 5 min — revert after schedule email confirmation
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic override"
        required: false
        default: ""
      no_ai:
        description: "Skip AI (use templates only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LinkedIn agent (email only)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-sonnet-4-6' }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
        run: |
          set -e
          ARGS=()
          if [ "${{ github.event.inputs.no_ai }}" = "true" ]; then
            ARGS+=(--no-ai)
          fi
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            ARGS+=(--topic "$TOPIC")
          fi
          python run_agent.py "${ARGS[@]}"
