# Run LinkedIn Post Agent 3× daily (no local PC needed)
#
# Cron is UTC. Defaults ≈ 9:00 / 14:00 / 19:00 India time (IST = UTC+5:30):
#   03:30, 08:30, 13:30 UTC
# Adjust the cron lines below if you want different times.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   SMTP_USER, SMTP_PASSWORD, EMAIL_TO
# Optional:
#   OPENAI_API_KEY, OPENAI_MODEL, ANTHROPIC_API_KEY, AI_PROVIDER

name: LinkedIn Post Agent

on:
  schedule:
    # 9:00 IST
    - cron: "30 3 * * *"
    # 14:00 IST
    - cron: "30 8 * * *"
    # 19:00 IST
    - cron: "30 13 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic override"
        required: false
        default: ""
      no_ai:
        description: "Skip AI (use templates only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts (for infographic text on Linux)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run LinkedIn agent
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || 'claude-sonnet-4-20250514' }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER || 'auto' }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
        run: |
          set -e
          ARGS=()
          if [ "${{ github.event.inputs.no_ai }}" = "true" ]; then
            ARGS+=(--no-ai)
          fi
          TOPIC="${{ github.event.inputs.topic }}"
          if [ -n "$TOPIC" ]; then
            ARGS+=(--topic "$TOPIC")
          fi
          python run_agent.py "${ARGS[@]}"

      - name: Upload draft artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-draft-${{ github.run_id }}
          path: |
            drafts/
            data/post_history.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist topic history + latest drafts
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data drafts
          git add -f data/post_history.json drafts/*.md drafts/*.png || true
          if git diff --staged --quiet; then
            echo "No history/draft changes to commit"
          else
            git commit -m "chore: linkedin agent run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
